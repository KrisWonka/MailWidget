# OWNER: lead — 队友不得修改此文件
name: MailWidget
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    # 不写死个人 Team ID：scripts/install.sh 探测构建者自己的签名身份后，
    # 用 MAILWIDGET_TEAM_ID 环境变量注入（xcodegen 展开 ${...}）。
    DEVELOPMENT_TEAM: ${MAILWIDGET_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  MailWidgetApp:
    type: application
    platform: macOS
    sources:
      - MailWidgetApp
      - DataKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kris.mailwidget
        PRODUCT_NAME: MailWidget
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Configs/MailWidgetApp-Info.plist
      properties:
        # 必须是构建变量，不能让 xcodegen 写死 "1"：scripts/install.sh 每次构建
        # 都注入一个递增的 UTC 时间戳版本号，靠它让系统丢掉缓存的旧 widget。
        # 写死成常量的话，更新后桌面上仍会渲染旧内容。
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSUIElement: true
        NSAppleEventsUsageDescription: MailWidget reads unread counts and recent messages from Mail (fallback data source).
        CFBundleURLTypes:
          - CFBundleURLName: com.kris.mailwidget.url
            CFBundleURLSchemes: [mailwidget]
        # 代码不再把 Team ID 编译进源码，运行时从这里读 App Group（见 SharedConstants）。
        AppGroupIdentifier: $(DEVELOPMENT_TEAM).com.kris.mailwidget
    entitlements:
      path: Configs/MailWidgetApp.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.application-groups:
          - $(DEVELOPMENT_TEAM).com.kris.mailwidget
    dependencies:
      - target: MailWidgetExtension
        embed: true
  MailWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - MailWidgetExtension
      - DataKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kris.mailwidget.widget
        PRODUCT_NAME: MailWidgetExtension
        SKIP_INSTALL: YES
    info:
      path: Configs/MailWidgetExtension-Info.plist
      properties:
        # 同宿主 app：extension 的版本号也必须跟着递增，否则 WidgetKit 会继续用
        # 缓存里的旧 extension。
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: MailWidget
        AppGroupIdentifier: $(DEVELOPMENT_TEAM).com.kris.mailwidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Configs/MailWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(DEVELOPMENT_TEAM).com.kris.mailwidget
  DataKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DataKitTests
      - DataKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kris.mailwidget.datakittests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MailWidget:
    build:
      targets:
        MailWidgetApp: all
        DataKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DataKitTests
